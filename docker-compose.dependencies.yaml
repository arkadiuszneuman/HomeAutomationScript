version: "2"
services:
  influxdb:
    image: influxdb:2.7.1
    # ports:
    # - 8086:8086
    # - 8083:8083
    volumes:
      - ./influxdb:/var/lib/influxdb
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=primary
      - DOCKER_INFLUXDB_INIT_BUCKET=home_assistant
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_TOKEN}
    network_mode: host
    container_name: influxdb
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management-alpine
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # ports:
    # - 5672:5672
    # - 15672:15672
    network_mode: host
    container_name: rabbit
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.21
    # ports:
    # - 1883:1883
    # - 9001:9001
    volumes:
      - ./mosquitto:/mosquitto
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    container_name: mosquitto
    restart: unless-stopped

  start_dependencies:
    image: dadarek/wait-for-dependencies:0.2
    depends_on:
      - rabbitmq
      - influxdb
      - mosquitto
    network_mode: host
    command: localhost:1883 localhost:8086 localhost:5672
