# Shim pozwalający uruchomić dodatek Vultron (napisany pod HA Supervised)
# na czystym Dockerze. Vultron ma zahardkodowane http://supervisor/core/api
# oraz ws://supervisor/core/websocket, więc ten kontener nazywa się w sieci
# "supervisor" i przepisuje /core/* na Core API Home Assistanta (:8123/api/*).
#
# Celowo NIE ustawiamy X-Forwarded-For — HA autoryzuje po tokenie Bearer,
# a brak nagłówka oznacza, że nie trzeba dopisywać tej sieci do trusted_proxies.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name supervisor;
    server_tokens off;

    location = /core/websocket {
        proxy_pass http://host.docker.internal:8123/api/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /core/api/ {
        proxy_pass http://host.docker.internal:8123/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /core/api {
        proxy_pass http://host.docker.internal:8123/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
