services:
    ha:
        image: homeassistant/home-assistant:2026.8
        # ports:
        # - 8123:8123
        volumes:
            - ./homeassistant:/config
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
        depends_on:
            - mysql
            - mosquitto
            - influxdb
        network_mode: host
        container_name: ha
        restart: unless-stopped

    nginx:
        image: nginx:1.31.3
        ports:
            - 80:80
            - 443:443
        restart: unless-stopped
        volumes:
            - ./nginx/conf/:/etc/nginx/conf.d/:ro
            - ./certbot/www/:/var/www/certbot/:ro
            - ./certbot/conf/:/etc/nginx/ssl/:ro
        networks:
            - automation
        extra_hosts:
            - "host.docker.internal:host-gateway"
        container_name: nginx

    certbot:
        image: certbot/certbot:v5.7.0
        volumes:
            - ./certbot/www/:/var/www/certbot/:rw
            - ./certbot/conf/:/etc/letsencrypt/:rw
        networks:
            - automation
        container_name: certbot

    grafana:
        image: grafana/grafana:13.1.3
        ports:
            - 3000:3000
        volumes:
            - ./grafana:/var/lib/grafana
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - automation
        user: "1000"
        container_name: grafana
        restart: unless-stopped

    mysql:
        image: mysql:9.7.2
        ports:
            - 3306:3306
        volumes:
            - ./mysql:/var/lib/mysql
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        networks:
            - automation
        container_name: mysql
        restart: unless-stopped

    mosquitto:
        image: eclipse-mosquitto:2.0.22
        ports:
            - 1883:1883
        volumes:
            - ./mosquitto:/mosquitto
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - automation
        container_name: mosquitto
        restart: unless-stopped

    influxdb:
        image: influxdb:2.9.1
        ports:
            - 8086:8086
        volumes:
            - ./influxdb2:/var/lib/influxdb2
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            - DOCKER_INFLUXDB_INIT_MODE=setup
            - DOCKER_INFLUXDB_INIT_USERNAME=admin
            - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
            - DOCKER_INFLUXDB_INIT_ORG=primary
            - DOCKER_INFLUXDB_INIT_BUCKET=home_assistant
            - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_TOKEN}
        networks:
            - automation
        container_name: influxdb
        restart: unless-stopped

    zigbee2mqtt:
        image: koenkk/zigbee2mqtt:2.13.0
        depends_on:
            - mosquitto
        volumes:
            - ./zigbee2mqtt/data:/app/data
            - /run/udev:/run/udev:ro
        ports:
            - 8082:8082
        environment:
            - TZ=Europe/Warsaw
        devices:
            # Make sure this matched your adapter location
            - /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2660192-if00:/dev/ttyACM0
        networks:
            - automation
        container_name: z2m
        restart: unless-stopped

    node-red:
        image: nodered/node-red:5.0.4
        environment:
            - TZ=Europe/Warsaw
            - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
        #    ports:
        #      - "1880:1880"
        volumes:
            - ./nodered:/data
        network_mode: host
        container_name: node-red
        restart: unless-stopped

    # ── Vultron (EduVulcan) ────────────────────────────────────────────────
    # Dodatek pisany pod HA Supervised; uruchamiamy go na czystym Dockerze.
    # Szczegóły obejścia braku Supervisora: vultron/README.md
    vultron-supervisor:
        image: nginx:1.31.3
        volumes:
            - ./vultron/supervisor-proxy.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            vultron:
                aliases:
                    - supervisor
        extra_hosts:
            - "host.docker.internal:host-gateway"
        container_name: vultron-supervisor
        restart: unless-stopped

    vultron:
        build:
            # Lokalny Dockerfile (vultron/Dockerfile) buduje FROM obrazu
            # upstreamu (kontekst "upstream" poniżej) i tylko dokłada
            # run_wrapper.py — sam kod dodatku nie jest forkowany.
            # Aktualizacja = podmiana refa w obu miejscach poniżej + rebuild.
            context: ./vultron
            additional_contexts:
                upstream: "https://github.com/htomasz/vultron.git#main:vultron"
        depends_on:
            - vultron-supervisor
        environment:
            # Vultron czyta SUPERVISOR_TOKEN; podajemy long-lived access token HA.
            - SUPERVISOR_TOKEN=${HA_TOKEN}
            - TZ=Europe/Warsaw
        volumes:
            - ./vultron/data:/data
            - ./homeassistant:/config
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        # Chromium pod Selenium potrzebuje większego /dev/shm
        shm_size: "1gb"
        networks:
            - vultron
        container_name: vultron
        restart: unless-stopped

networks:
    automation:
        driver: bridge

    vultron:
        driver: bridge
