homeassistant:
  # Everything except core setup lives in packages/, one file per topic.
  packages: !include_dir_named packages

default_config:

logger:
  default: warning
  logs:
    homeassistant.components.fan: error
    homeassistant.config_entries: error
    homeassistant.components.binary_sensor.ping: error

wake_on_lan:

# UI-edited automations/scripts/scenes. The scenes are empty on purpose: Node-RED
# and Google Assistant use them as buttons.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
