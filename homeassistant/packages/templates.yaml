template:
  - sensor:
      - name: "Światło słoneczne"
        unique_id: sunlight_pct
        unit_of_measurement: '%'
        availability: "{{ has_value('sensor.openweathermap_cloud_coverage') }}"
        state: >-
          {%- set elevation = state_attr('sun.sun','elevation') | float(0) %}
          {%- set cloud_coverage = states('sensor.openweathermap_cloud_coverage') | float(0) %}
          {%- set cloud_factor = (1 - (0.75 * ( cloud_coverage / 100) ** 3 )) %}
          {%- set min_elevation = -6 %}
          {%- set max_elevation = 90 %}
          {%- set adjusted_elevation = [elevation - min_elevation, 0] | max %}
          {%- set adjusted_elevation = [adjusted_elevation, max_elevation - min_elevation] | min %}
          {%- set adjusted_elevation = adjusted_elevation / (max_elevation - min_elevation) * 100 %}
          {{ (adjusted_elevation * cloud_factor) | round }}
