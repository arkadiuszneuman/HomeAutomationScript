name: automation-staging

networks:
  stg:
    driver: bridge

services:
  ha:
    image: homeassistant/home-assistant:2026.8
    container_name: stg-ha
    ports:
      - "8124:8123"
    volumes:
      - /home/arek/automation-staging/homeassistant:/config
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mysql
      - mosquitto
      - influxdb
    networks:
      - stg
    restart: unless-stopped

  mysql:
    image: mysql:9.7.2
    container_name: stg-mysql
    ports:
      - "3307:3306"
    volumes:
      - /home/arek/automation-staging/mysql:/var/lib/mysql
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - stg
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: stg-mosquitto
    ports:
      - "1884:1883"
    volumes:
      - /home/arek/automation-staging/mosquitto:/mosquitto
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - stg
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9.1
    container_name: stg-influxdb
    ports:
      - "8087:8086"
    volumes:
      - /home/arek/automation-staging/influxdb2:/var/lib/influxdb2
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=primary
      - DOCKER_INFLUXDB_INIT_BUCKET=home_assistant
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_TOKEN}
    networks:
      - stg
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    container_name: stg-grafana
    ports:
      - "3001:3000"
    volumes:
      - /home/arek/automation-staging/grafana:/var/lib/grafana
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    user: "1000"
    networks:
      - stg
    restart: unless-stopped

  node-red:
    image: nodered/node-red:5.0.4
    container_name: stg-node-red
    ports:
      - "1881:1880"
    environment:
      - TZ=Europe/Warsaw
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
    volumes:
      - /home/arek/automation-staging/nodered:/data
    networks:
      - stg
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.13.0
    container_name: stg-z2m
    ports:
      - "8083:8082"
    volumes:
      - /home/arek/automation-staging/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=Europe/Warsaw
    # devices:
    #   Uncomment only for the brief ConBee II borrow-and-test window (plan Phase 3,
    #   step 12) — the adapter must be stopped on prod (z2m) first:
    #   - /dev/serial/by-id/usb-dresden_elektronik_ingenieurtechnik_GmbH_ConBee_II_DE2660192-if00:/dev/ttyACM0
    networks:
      - stg
    restart: unless-stopped
